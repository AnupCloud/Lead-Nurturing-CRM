[project]
name = "cms-real-estate-backend"
version = "0.1.0"
description = "Backend for CMS Real Estate Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.0",
    "django-ninja>=1.0",
    "langgraph",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "vanna",
    "chromadb",
    "pypdf",
    "python-dotenv",
    "psycopg2-binary", # For PostgreSQL if needed, or just use sqlite3 built-in
    "deepeval",
    "pytest",
    "pytest-django",
    "uvicorn",
    "gunicorn",
    "django-cors-headers>=4.9.0",
    "google-generativeai>=0.8.5",
    "pyjwt>=2.10.1",
    "python-multipart>=0.0.20",
    "aisuite>=0.1.13",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
